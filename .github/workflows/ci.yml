name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run exporter tests
        run: cd exporter/agentauditexporter && go test -race -coverprofile=../../coverage.out ./...
      - name: Report coverage
        run: cd exporter/agentauditexporter && go tool cover -func=../../coverage.out | grep total
      - name: Coverage gate — exporter main package (≥80%)
        run: |
          cd exporter/agentauditexporter
          go test -race -coverprofile=/tmp/cov-main.out .
          go tool cover -func=/tmp/cov-main.out | awk '/^total:/{gsub(/%/,"",$NF); p=$NF+0; printf "exporter main: %.1f%%\n",p; if(p<80){printf "FAIL: %.1f%% < 80%%\n",p; exit 1}}'
      - name: Coverage gate — internal/wal (≥80%)
        run: |
          cd exporter/agentauditexporter
          go test -race -coverprofile=/tmp/cov-wal.out ./internal/wal/
          go tool cover -func=/tmp/cov-wal.out | awk '/^total:/{gsub(/%/,"",$NF); p=$NF+0; printf "internal/wal: %.1f%%\n",p; if(p<80){printf "FAIL: %.1f%% < 80%%\n",p; exit 1}}'
      - name: Run processor tests
        run: cd processor/agentauditselect && go test -race ./...
      - name: Build verifier CLI
        run: cd exporter/agentauditexporter && go build -o /dev/null ./cmd/otel-agent-audit-verify

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: exporter/agentauditexporter
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          working-directory: processor/agentauditselect

  build:
    name: Build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Install OpenTelemetry Collector Builder
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.154.0
      - name: Build demo collector distro
        run: GOWORK=off builder --config=ocb/builder-config.yaml

  check-sync:
    name: Required checks in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install "pyyaml==6.0.1" --quiet
      - name: Verify required checks are in sync
        run: python .github/scripts/check_required_checks.py
        env:
          CHECKS_SYNC_TOKEN: ${{ secrets.CHECKS_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref || 'main' }}
